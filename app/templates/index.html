{% extends "base.html" %}

{% block head %}
    <script src="https://api-maps.yandex.ru/2.1/?apikey={{ api_key }}&lang=ru_RU" type="text/javascript"></script>
    <style>
        #map { width: 100%; height: 80vh; }
    </style>
{% endblock %}

{% block content %}
<div id="map"></div>

<script type="text/javascript">
    ymaps.ready(init);
    function init() {
        var myMap = new ymaps.Map('map', {
            center: [55.76, 37.64],
            zoom: 7,
            controls: ['zoomControl', 'searchControl', 'typeSelector', 'fullscreenControl']
        });

        // Клик по карте для добавления метки
        myMap.events.add('click', function (e) {
            var coords = e.get('coords');
            if (confirm('Добавить метку в этой точке?')) {
                window.location.href = '/add_marker?lat=' + coords[0].toFixed(6) + '&lon=' + coords[1].toFixed(6);
            }
        });

        // Загружаем публичные метки через API
        fetch('/api/markers')
            .then(response => response.json())
            .then(data => {
                var objectManager = new ymaps.ObjectManager({
                    clusterize: true,
                    gridSize: 64
                });
                objectManager.add(data);
                myMap.geoObjects.add(objectManager);
            });

        // Загружаем GPX треки
        fetch('/api/tracks')
            .then(response => response.json())
            .then(tracks => {
                tracks.forEach(track => {
                    var geojson = JSON.parse(track.geojson);
                    var geoObject = ymaps.geoQuery(geojson).addToMap(myMap);
                });
            });
    }
</script>
{% endblock %}
