{% extends "base.html" %}
{% import "bootstrap/wtf.html" as wtf %}

{% block head %}
<script src="https://api-maps.yandex.ru/2.1/?apikey={{ api_key }}&lang=ru_RU" type="text/javascript"></script>
{% endblock %}

{% block content %}
<h2>Добавить метку</h2>
<div class="row">
    <div class="col-md-6">
        <div id="preview-map" style="width: 100%; height: 300px;"></div>
    </div>
    <div class="col-md-6">
        {{ wtf.quick_form(form) }}
    </div>
</div>

<script type="text/javascript">
    ymaps.ready(function () {
        var lat = {{ form.latitude.data or 55.76 }};
    var lon = {{ form.longitude.data or 37.64 }};
    var previewMap = new ymaps.Map('preview-map', {
        center: [lat, lon],
        zoom: 10,
        controls: ['zoomControl']
    });
    var placemark = new ymaps.Placemark([lat, lon]);
    previewMap.geoObjects.add(placemark);

    // Обновление координат при изменении полей формы
    document.getElementById('latitude').addEventListener('change', updatePlacemark);
    document.getElementById('longitude').addEventListener('change', updatePlacemark);

    function updatePlacemark() {
        var newLat = parseFloat(document.getElementById('latitude').value);
        var newLon = parseFloat(document.getElementById('longitude').value);
        if (!isNaN(newLat) && !isNaN(newLon)) {
            placemark.geometry.setCoordinates([newLat, newLon]);
            previewMap.setCenter([newLat, newLon]);
        }
    }
    });
</script>
{% endblock %}
